<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>省活攻略 · 管理后台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",-apple-system,sans-serif; background:#f4f6fb; color:#222; font-size:14px; }
  /* 登录 */
  #loginView { height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#4B3FE3,#7b5cff); }
  .login-card { width:340px; background:#fff; border-radius:16px; padding:36px 32px; box-shadow:0 20px 50px rgba(0,0,0,.2); }
  .login-card h1 { text-align:center; font-size:22px; color:#4B3FE3; margin-bottom:6px; }
  .login-card p { text-align:center; color:#999; font-size:12px; margin-bottom:24px; }
  .field { margin-bottom:16px; }
  .field input { width:100%; height:44px; border:1px solid #ddd; border-radius:8px; padding:0 14px; font-size:14px; }
  .btn { width:100%; height:44px; border:none; border-radius:8px; background:#4B3FE3; color:#fff; font-size:15px; cursor:pointer; }
  .btn:hover { opacity:.9; }
  .error { color:#e5533c; font-size:12px; height:18px; text-align:center; margin-bottom:8px; }
  /* 主布局 */
  #mainView { display:none; height:100vh; }
  .sidebar { width:200px; background:#2f2a6e; color:#fff; height:100%; position:fixed; top:0; left:0; padding-top:20px; }
  .sidebar .brand { text-align:center; font-size:17px; font-weight:600; padding:16px 0 24px; }
  .nav-item { padding:13px 26px; cursor:pointer; color:#c7c3ee; font-size:14px; border-left:3px solid transparent; }
  .nav-item:hover { background:rgba(255,255,255,.08); color:#fff; }
  .nav-item.active { background:rgba(255,255,255,.12); color:#fff; border-left-color:#7b5cff; }
  .main { margin-left:200px; padding:24px 28px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .topbar h2 { font-size:20px; }
  .logout { color:#4B3FE3; cursor:pointer; font-size:14px; }
  .section { display:none; }
  .section.active { display:block; }
  /* 统计卡 */
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:20px; }
  .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .card .num { font-size:28px; font-weight:700; color:#4B3FE3; }
  .card .label { color:#888; font-size:13px; margin-top:6px; }
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chart-box { background:#fff; border-radius:12px; padding:16px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .chart-box h4 { margin-bottom:10px; color:#444; font-size:14px; }
  .chart { height:300px; }
  /* 工具栏 */
  .toolbar { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .toolbar input, .toolbar select { height:34px; border:1px solid #ddd; border-radius:6px; padding:0 10px; font-size:13px; }
  .toolbar .btn { width:auto; height:34px; padding:0 16px; border-radius:6px; font-size:13px; }
  .btn.small { width:auto; height:30px; padding:0 12px; font-size:12px; border-radius:6px; }
  .btn.ghost { background:#fff; color:#4B3FE3; border:1px solid #4B3FE3; }
  .btn.danger { background:#e5533c; }
  /* 表格 */
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  th, td { text-align:left; padding:11px 14px; border-bottom:1px solid #f0f0f0; font-size:13px; }
  th { background:#fafbfe; color:#666; font-weight:600; }
  tr:hover td { background:#fafaff; }
  .badge { padding:2px 10px; border-radius:10px; font-size:12px; }
  .badge.green { background:#e6f6ea; color:#1a8f46; }
  .badge.orange { background:#fdf0df; color:#d97b0c; }
  .badge.red { background:#fde8e5; color:#d2432f; }
  /* 弹窗 */
  .mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); align-items:center; justify-content:center; z-index:50; }
  .modal { width:520px; background:#fff; border-radius:12px; padding:22px; max-height:85vh; overflow:auto; }
  .modal h3 { margin-bottom:14px; }
  .modal label { display:block; font-size:13px; color:#666; margin:10px 0 4px; }
  .modal input, .modal textarea, .modal select { width:100%; border:1px solid #ddd; border-radius:6px; padding:8px 10px; font-size:13px; }
  .modal textarea { height:160px; resize:vertical; }
  .modal .row { display:flex; gap:10px; }
  .modal .row > div { flex:1; }
  .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
  .pager { margin-top:12px; color:#888; font-size:13px; }
</style>
</head>
<body>
<!-- 登录 -->
<div id="loginView">
  <div class="login-card">
    <h1>省活攻略 · 管理后台</h1>
    <p>请输入管理员账号登录</p>
    <div class="field"><input id="loginUser" placeholder="账号" autocomplete="off"></div>
    <div class="field"><input id="loginPwd" type="password" placeholder="密码" autocomplete="off"></div>
    <div class="error" id="loginErr"></div>
    <button class="btn" id="loginBtn">登 录</button>
  </div>
</div>
<!-- 主界面 -->
<div id="mainView">
  <div class="sidebar">
    <div class="brand">省活攻略<br>管理后台</div>
    <div class="nav-item active" data-sec="stat">📊 数据看板</div>
    <div class="nav-item" data-sec="users">👥 用户管理</div>
    <div class="nav-item" data-sec="articles">📄 攻略文章</div>
    <div class="nav-item" data-sec="posts">💬 社区帖子</div>
    <div class="nav-item" data-sec="comments">🗨️ 评论管理</div>
  </div>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">数据看板</h2>
      <span class="logout" id="logoutBtn">退出登录</span>
    </div>    <div id="sec-stat" class="section active">
      <div class="cards" id="statCards"></div>
      <div class="charts">
        <div class="chart-box"><h4>近 7 天新增用户</h4><div id="chartUsers" class="chart"></div></div>
        <div class="chart-box"><h4>账单分类占比</h4><div id="chartBill" class="chart"></div></div>
      </div>
    </div>

    <div id="sec-users" class="section">
      <div class="toolbar">
        <input id="userQ" placeholder="搜索昵称" onkeyup="if(event.key==='Enter')loadUsers()">
        <button class="btn" onclick="loadUsers()">搜索</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>昵称</th><th>预算(元)</th><th>已省(元)</th><th>账单总额(元)</th><th>发帖数</th><th>注册时间</th><th>操作</th></tr></thead>
        <tbody id="userTbody"></tbody>
      </table>
      <div class="pager" id="userPager"></div>
    </div>

    <div id="sec-articles" class="section">
      <div class="toolbar">
        <input id="articleQ" placeholder="搜索标题" onkeyup="if(event.key==='Enter')loadArticles()">
        <button class="btn" onclick="loadArticles()">搜索</button>
        <button class="btn" style="background:#ffb020;color:#fff" onclick="openArticle()">+ 新增文章</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>标题</th><th>分类</th><th>作者</th><th>点赞</th><th>浏览</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="articleTbody"></tbody>
      </table>
      <div class="pager" id="articlePager"></div>
    </div>

    <div id="sec-posts" class="section">
      <div class="toolbar">
        <input id="postQ" placeholder="搜索标题" onkeyup="if(event.key==='Enter')loadPosts()">
        <select id="postStatus" onchange="loadPosts()">
          <option value="">全部状态</option>
          <option value="approved">已通过</option>
          <option value="pending">待审核</option>
          <option value="rejected">已驳回</option>
        </select>
        <button class="btn" onclick="loadPosts()">查询</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>标题</th><th>作者</th><th>状态</th><th>点赞</th><th>评论</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="postTbody"></tbody>
      </table>
      <div class="pager" id="postPager"></div>
    </div>

    <div id="sec-comments" class="section">
      <div class="toolbar">
        <input id="commentQ" placeholder="搜索评论内容" onkeyup="if(event.key==='Enter')loadComments()">
        <button class="btn" onclick="loadComments()">搜索</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>作者</th><th>评论内容</th><th>所属</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="commentTbody"></tbody>
      </table>
      <div class="pager" id="commentPager"></div>
    </div>
  </div>
</div>

<!-- 文章编辑弹窗 -->
<div class="mask" id="articleModal">
  <div class="modal">
    <h3 id="articleModalTitle">新增文章</h3>
    <label>标题</label><input id="af_title" placeholder="文章标题">
    <div class="row">
      <div><label>分类</label><select id="af_category">
        <option>餐饮</option><option>购物</option><option>生活</option><option>羊毛</option><option>综合</option>
      </select></div>
      <div><label>作者</label><input id="af_author" value="抠门达人"></div>
    </div>
    <label>封面图 URL（可空）</label><input id="af_cover" placeholder="https://...">
    <label>正文（Markdown）</label><textarea id="af_content"></textarea>
    <div class="actions">
      <button class="btn ghost" onclick="closeArticle()">取消</button>
      <button class="btn" onclick="saveArticle()">保存</button>
    </div>
  </div>
</div><script>
var TOKEN = '';
var PG = {}; // 各列表页码

function t() { return localStorage.getItem('admin_token') || ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

async function api(path, method, body) {
  var opt = { method: method || 'GET', headers: { 'Authorization': 'Bearer ' + t() } };
  if (body) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  var res = await fetch('/admin/api' + path, opt);
  if (res.status === 401) { doLogout(); throw new Error('登录已过期'); }
  var j = await res.json().catch(function(){ return {}; });
  if (j.code !== 200) throw new Error(j.message || '请求失败');
  return j.data;
}

/* ---- 登录 / 退出 ---- */
async function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPwd').value;
  if (!u || !p) { document.getElementById('loginErr').textContent = '请输入账号和密码'; return; }
  try {
    var data = await api('/login', 'POST', { username: u, password: p });
  } catch (err) { document.getElementById('loginErr').textContent = err.message; return; }
  localStorage.setItem('admin_token', data.token);
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  showSection('stat');
}
function doLogout() {
  localStorage.removeItem('admin_token');
  location.reload();
}
function boot() {
  if (t()) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    showSection('stat');
  }
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('logoutBtn').onclick = doLogout;
  document.getElementById('loginPwd').onkeydown = function(e){ if (e.key==='Enter') doLogin(); };
  document.querySelectorAll('.nav-item').forEach(function(n){
    n.onclick = function(){ showSection(n.getAttribute('data-sec')); };
  });
}
function showSection(sec) {
  document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.toggle('active', n.getAttribute('data-sec')===sec); });
  document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById('sec-' + sec).classList.add('active');
  var title = {stat:'数据看板',users:'用户管理',articles:'攻略文章',posts:'社区帖子',comments:'评论管理'};
  document.getElementById('pageTitle').textContent = title[sec];
  if (sec==='stat') loadStats();
  if (sec==='users') loadUsers();
  if (sec==='articles') loadArticles();
  if (sec==='posts') loadPosts();
  if (sec==='comments') loadComments();
}

/* ---- 数据看板 ---- */
function chart(id, init) {
  if (typeof echarts === 'undefined') { document.getElementById(id).innerHTML = '<p style="color:#999;padding-top:40px;text-align:center">图表库未加载（需联网）</p>'; return; }
  var c = echarts.init(document.getElementById(id));
  init(c);
  window.addEventListener('resize', function(){ c.resize(); });
}
function loadStats() {
  api('/stats').then(function(st){
    var c = st.counts, cards = '';
    var defs = [['用户数', c.users], ['文章数', c.articles], ['帖子数', c.posts], ['评论数', c.comments], ['账单数', c.bills]];
    defs.forEach(function(d){ cards += '<div class="card"><div class="num">' + d[1] + '</div><div class="label">' + d[0] + '</div></div>'; });
    document.getElementById('statCards').innerHTML = cards;
    var bar = echarts.init(document.getElementById('chartUsers'));
    if (typeof echarts !== 'undefined') { bar.setOption({
      tooltip:{}, grid:{left:40,right:16,top:20,bottom:24},
      xAxis:{type:'category', data:st.new_users.days},
      yAxis:{type:'value', minInterval:1},
      series:[{type:'bar', data:st.new_users.values, itemStyle:{color:'#4B3FE3'}, barWidth:'50%'}]
    }); }
    var pie = echarts.init(document.getElementById('chartBill'));
    if (typeof echarts !== 'undefined') { pie.setOption({
      tooltip:{trigger:'item', formatter:'{b}: ¥{c} ({d}%)'},
      legend:{bottom:0},
      series:[{type:'pie', radius:['35%','62%'], center:['50%','46%'],
        data:st.bill_pie.length ? st.bill_pie : [{name:'暂无账单', value:1}],
        label:{formatter:'{b}\n¥{c}'}}]
    }); }
  }).catch(function(e){ alert(e.message); });
}

/* ---- 用户管理 ---- */
function loadUsers() {
  var q = document.getElementById('userQ').value.trim();
  var page = PG.users || 1;
  api('/users?q=' + encodeURIComponent(q) + '&skip=' + ((page-1)*50) + '&limit=50').then(function(d){
    var rows = d.items.map(function(u){ return '<tr><td>'+u.id+'</td><td>'+esc(u.nickname)+'</td><td>'+u.budget_goal+'</td><td>'+u.total_saved+'</td><td>'+u.bill_total+'</td><td>'+u.post_count+'</td><td>'+u.created_at+'</td><td><button class="btn small danger" onclick="delUser('+u.id+',\''+esc(u.nickname).replace(/'/g,"\\'")+'\')">删除</button></td></tr>'; }).join('');
    document.getElementById('userTbody').innerHTML = rows || '<tr><td colspan="8" style="text-align:center;color:#aaa">暂无数据</td></tr>';
    document.getElementById('userPager').textContent = '共 ' + d.total + ' 条' + (page>1 ? ' · <a onclick="PG.users='+(page-1)+';loadUsers()">上一页</a>' : '') + (page*50<d.total ? ' · <a onclick="PG.users='+(page+1)+';loadUsers()">下一页</a>' : '');
  }).catch(function(e){ alert(e.message); });
}
function delUser(id, name) {
  if (!confirm('确认删除用户「' + name + '」及其所有数据？')) return;
  api('/users/' + id, 'DELETE').then(function(){ alert('已删除'); loadUsers(); }).catch(function(e){ alert(e.message); });
}

/* ---- 文章管理 ---- */
var editingArticleId = null;
function loadArticles() {
  var q = document.getElementById('articleQ').value.trim();
  var page = PG.articles || 1;
  api('/articles?q=' + encodeURIComponent(q) + '&skip=' + ((page-1)*50) + '&limit=50').then(function(d){
    var rows = d.items.map(function(a){ return '<tr><td>'+a.id+'</td><td>'+esc(a.title)+'</td><td>'+esc(a.category)+'</td><td>'+esc(a.author)+'</td><td>'+a.likes+'</td><td>'+a.views+'</td><td>'+a.created_at+'</td><td><button class="btn small ghost" onclick="editArticle('+a.id+')">编辑</button> <button class="btn small danger" onclick="delArticle('+a.id+')">删除</button></td></tr>'; }).join('');
    document.getElementById('articleTbody').innerHTML = rows || '<tr><td colspan="8" style="text-align:center;color:#aaa">暂无数据</td></tr>';
    document.getElementById('articlePager').textContent = '共 ' + d.total + ' 条' + (page>1 ? ' · <a onclick="PG.articles='+(page-1)+';loadArticles()">上一页</a>' : '') + (page*50<d.total ? ' · <a onclick="PG.articles='+(page+1)+';loadArticles()">下一页</a>' : '');
  }).catch(function(e){ alert(e.message); });
}
function openArticle() {
  editingArticleId = null;
  document.getElementById('articleModalTitle').textContent = '新增文章';
  document.getElementById('af_title').value = '';
  document.getElementById('af_category').value = '综合';
  document.getElementById('af_author').value = '抠门达人';
  document.getElementById('af_cover').value = '';
  document.getElementById('af_content').value = '';
  document.getElementById('articleModal').style.display = 'flex';
}
function editArticle(id) {
  editingArticleId = id;
  document.getElementById('articleModal').style.display = 'flex';
  api('/articles?q=&skip=0&limit=1000').then(function(d){
    var a = d.items.filter(function(x){ return x.id===id; })[0];
    if (!a) return;
    document.getElementById('articleModalTitle').textContent = '编辑文章 #' + id;
    document.getElementById('af_title').value = a.title;
    document.getElementById('af_category').value = a.category;
    document.getElementById('af_author').value = a.author;
  });
}
function closeArticle() { document.getElementById('articleModal').style.display = 'none'; }
function saveArticle() {
  var body = { title: document.getElementById('af_title').value.trim(),
    category: document.getElementById('af_category').value,
    author: document.getElementById('af_author').value.trim() || '抠门达人',
    cover: document.getElementById('af_cover').value.trim(),
    content: document.getElementById('af_content').value };
  if (!body.title) { alert('标题不能为空'); return; }
  var p = editingArticleId ? api('/articles/' + editingArticleId, 'PUT', body) : api('/articles', 'POST', body);
  p.then(function(){ alert('已保存'); closeArticle(); loadArticles(); }).catch(function(e){ alert(e.message); });
}
function delArticle(id) {
  if (!confirm('确认删除该文章？')) return;
  api('/articles/' + id, 'DELETE').then(function(){ alert('已删除'); loadArticles(); }).catch(function(e){ alert(e.message); });
}

/* ---- 帖子管理 ---- */
function loadPosts() {
  var q = document.getElementById('postQ').value.trim();
  var st = document.getElementById('postStatus').value;
  var page = PG.posts || 1;
  api('/posts?q=' + encodeURIComponent(q) + '&status=' + encodeURIComponent(st) + '&skip=' + ((page-1)*50) + '&limit=50').then(function(d){
    var badge = {approved:'green', pending:'orange', rejected:'red'};
    var label = {approved:'已通过', pending:'待审核', rejected:'已驳回'};
    var rows = d.items.map(function(p){ return '<tr><td>'+p.id+'</td><td>'+esc(p.title)+'</td><td>'+esc(p.author)+'</td><td><span class="badge '+badge[p.status]+'">'+label[p.status]+'</span></td><td>'+p.likes+'</td><td>'+p.comments_count+'</td><td>'+p.created_at+'</td><td>'+statusActions(p)+'</td></tr>'; }).join('');
    document.getElementById('postTbody').innerHTML = rows || '<tr><td colspan="8" style="text-align:center;color:#aaa">暂无数据</td></tr>';
    document.getElementById('postPager').textContent = '共 ' + d.total + ' 条' + (page>1 ? ' · <a onclick="PG.posts='+(page-1)+';loadPosts()">上一页</a>' : '') + (page*50<d.total ? ' · <a onclick="PG.posts='+(page+1)+';loadPosts()">下一页</a>' : '');
  }).catch(function(e){ alert(e.message); });
}
function statusActions(p) {
  var b = '<button class="btn small ghost" onclick="setPostStatus('+p.id+',\'approved\')">通过</button> <button class="btn small ghost" onclick="setPostStatus('+p.id+',\'rejected\')">驳回</button> <button class="btn small danger" onclick="delPost('+p.id+')">删除</button>';
  return b;
}
function setPostStatus(id, status) {
  api('/posts/' + id + '/status', 'PATCH', { status: status }).then(function(){ loadPosts(); }).catch(function(e){ alert(e.message); });
}
function delPost(id) {
  if (!confirm('确认删除该帖子及其评论？')) return;
  api('/posts/' + id, 'DELETE').then(function(){ alert('已删除'); loadPosts(); }).catch(function(e){ alert(e.message); });
}

/* ---- 评论管理 ---- */
function loadComments() {
  var q = document.getElementById('commentQ').value.trim();
  var page = PG.comments || 1;
  api('/comments?q=' + encodeURIComponent(q) + '&skip=' + ((page-1)*50) + '&limit=50').then(function(d){
    var rows = d.items.map(function(c){ return '<tr><td>'+c.id+'</td><td>'+esc(c.author)+'</td><td>'+esc(c.content)+'</td><td>'+esc(c.target_title)+'</td><td>'+c.created_at+'</td><td><button class="btn small danger" onclick="delComment('+c.id+')">删除</button></td></tr>'; }).join('');
    document.getElementById('commentTbody').innerHTML = rows || '<tr><td colspan="6" style="text-align:center;color:#aaa">暂无数据</td></tr>';
    document.getElementById('commentPager').textContent = '共 ' + d.total + ' 条' + (page>1 ? ' · <a onclick="PG.comments='+(page-1)+';loadComments()">上一页</a>' : '') + (page*50<d.total ? ' · <a onclick="PG.comments='+(page+1)+';loadComments()">下一页</a>' : '');
  }).catch(function(e){ alert(e.message); });
}
function delComment(id) {
  if (!confirm('确认删除该评论？')) return;
  api('/comments/' + id, 'DELETE').then(function(){ alert('已删除'); loadComments(); }).catch(function(e){ alert(e.message); });
}

boot();
</script>
</body>
</html>
