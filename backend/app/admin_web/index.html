<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>省钱攻略 · 管理后台</title>
<script src="/admin/assets/echarts.min.js"></script>
<style>
  :root{
    --primary:#20344D; --bg:#F4F6F9; --card:#FFFFFF; --action:#526CE5;
    --ok:#18A775; --warn:#E6A23C; --err:#DF5151; --muted:#8490A2;
    --line:#E4E9F0; --ink:#243040;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink);}
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#20344D,#31465f);}
  .login-box{width:360px;background:#fff;border-radius:14px;padding:36px 32px;box-shadow:0 16px 48px rgba(0,0,0,.25);}
  .login-box h1{font-size:20px;color:var(--primary);margin-bottom:6px;}
  .login-box p{color:var(--muted);font-size:12px;margin-bottom:22px;}
  .login-box .field{margin-bottom:14px;}
  .login-box input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;}
  .login-box .btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--action);color:#fff;font-size:15px;}
  .login-box .error{color:var(--err);font-size:12px;min-height:18px;margin-bottom:8px;}
  #mainView{display:none;min-height:100vh;}
  .layout{display:flex;min-height:100vh;}
  .sidebar{width:220px;flex:none;background:var(--primary);color:#cfd8e3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;transition:width .2s;}
  .sidebar.collapsed{width:60px;}
  .sidebar.collapsed .nav-text,.sidebar.collapsed .group-title,.sidebar.collapsed .logo-text{display:none;}
  .logo{display:flex;align-items:center;gap:10px;padding:18px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
  .logo-mark{width:30px;height:30px;flex:none;border-radius:8px;background:var(--action);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;}
  .logo-text{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;}
  .group-title{padding:14px 18px 6px;font-size:11px;color:#7d8ea3;letter-spacing:1px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;font-size:13px;border-left:3px solid transparent;white-space:nowrap;}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav-item.active{background:rgba(82,108,229,.22);color:#fff;border-left-color:var(--action);}
  .nav-ic{width:18px;text-align:center;flex:none;}
  .nav-badge{margin-left:auto;background:var(--warn);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:16px;}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:20;}
  .collapse-btn{border:1px solid var(--line);background:#fff;border-radius:6px;width:30px;height:30px;color:var(--muted);}
  .crumb{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .crumb b{color:var(--ink);font-size:15px;}
  .topbar .spacer{flex:1;}
  .admin-chip{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px;}
  .admin-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .logout{border:none;background:none;color:var(--muted);font-size:13px;}
  .logout:hover{color:var(--err);}
  .content{padding:20px;flex:1;min-width:0;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
  .grp-title{font-size:13px;font-weight:600;color:var(--muted);margin:2px 0 10px;}
  .grp-title span{font-size:11px;font-weight:400;color:#A6B0BF;margin-left:8px;}
  .cards.core{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .cards.ai{grid-template-columns:repeat(auto-fit,minmax(165px,1fr));}
  .chart-wrap{position:relative;}
  .chart-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);color:var(--muted);font-size:13px;gap:6px;}
  .chart-empty b{color:var(--ink);font-size:14px;}
  .panel-note{float:right;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;}
  .panel.sparse{padding:14px 16px;}
  .empty.compact{padding:14px 0;}
  .act-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .act-item:last-child{border-bottom:none;}
  .act-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
  .act-time{flex:none;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;}
  .sec-count{margin-left:auto;color:var(--muted);font-size:11px;flex:none;}
  .stat-card{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(20,30,50,.06);cursor:pointer;border:1px solid transparent;}
  .stat-card:hover{border-color:var(--action);}
  .stat-card .num{font-size:24px;font-weight:700;color:var(--primary);}
  .stat-card .lbl{color:var(--muted);font-size:12px;margin-top:4px;}
  .stat-card.warn .num{color:var(--warn);}
  .stat-card.ai .num{color:var(--action);}
  .panel{background:var(--card);border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(20,30,50,.06);margin-bottom:16px;}
  .panel h3{font-size:14px;color:var(--ink);margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:1100px){.grid2{grid-template-columns:1fr;}}
  @media(max-width:900px){.sidebar{width:60px;}.sidebar .nav-text,.sidebar .group-title,.sidebar .logo-text{display:none;}.admin-chip span{display:none;}}
  .chart{height:260px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px;}
  .toolbar input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:6px;width:200px;}
  .toolbar select{padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;}
  .btn{padding:8px 14px;border:none;border-radius:6px;background:var(--action);color:#fff;font-size:13px;}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn.ok{background:var(--ok);} .btn.warn{background:var(--warn);} .btn.err{background:var(--err);}
  .btn.sm{padding:4px 9px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  table{width:100%;border-collapse:collapse;background:#fff;}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
  th{background:#FAFBFC;color:var(--muted);font-weight:600;white-space:nowrap;}
  td .ops{display:flex;gap:6px;flex-wrap:wrap;}
  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;}
  .tag.ok{background:#E4F6EE;color:var(--ok);} .tag.warn{background:#FBF1E0;color:var(--warn);}
  .tag.err{background:#FBE7E7;color:var(--err);} .tag.grey{background:#EEF1F5;color:var(--muted);}
  .tag.ai{background:#EBEEFC;color:var(--action);}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:14px;color:var(--muted);font-size:13px;}
  .pager button{padding:5px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  .list-wrap{overflow-x:auto;}
  .mask{position:fixed;inset:0;background:rgba(15,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:#fff;border-radius:12px;width:520px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:22px;}
  .modal h3{margin-bottom:16px;font-size:16px;}
  .modal .f{margin-bottom:12px;}
  .modal label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px;}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;}
  .modal textarea{min-height:90px;resize:vertical;}
  .modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .imgrow{display:flex;gap:8px;}
  .imgrow input{flex:1;}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:8px;z-index:200;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px;}
  .kv .k{color:var(--muted);}
  .pending-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;}
  .pending-item:last-child{border-bottom:none;}
  .pending-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>
<div id="loginView">
  <div class="login-box">
    <h1>省钱攻略 · 管理后台</h1>
    <p>毕业设计综合管理系统</p>
    <div class="field"><input id="loginUser" placeholder="管理员账号" autocomplete="off"></div>
    <div class="field"><input id="loginPwd" type="password" placeholder="密码"></div>
    <div class="error" id="loginErr"></div>
    <button class="btn" id="loginBtn">登 录</button>
  </div>
</div>

<div id="mainView">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><div class="logo-mark">省</div><div class="logo-text">省钱攻略后台</div></div>
      <div id="nav"></div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="collapse-btn" id="collapseBtn" title="收起/展开">☰</button>
        <div class="crumb" id="crumb"></div>
        <div class="spacer"></div>
        <div class="admin-chip"><div class="admin-avatar" id="adminAvatar">A</div><span id="adminName"></span></div>
        <button class="logout" id="logoutBtn">退出</button>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<script>
'use strict';
var BASE='/admin/api';
function tok(){return localStorage.getItem('admin_token')||'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove();},2200);}
async function api(path,method,body){
  var opt={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(tok())opt.headers['Authorization']='Bearer '+tok();
  if(body!==undefined)opt.body=JSON.stringify(body);
  var res=await fetch(BASE+path,opt);
  var j=await res.json().catch(function(){return{};});
  if(res.status===401){showLogin();throw new Error(j.message||'登录已过期');}
  if(j.code!==200)throw new Error(j.message||('请求失败 '+res.status));
  return j.data;
}
async function uploadImage(file){
  if(file.size>2*1024*1024)throw new Error('图片超过 2MB 上限');
  var fd=new FormData();fd.append('file',file);
  var res=await fetch('/upload/image',{method:'POST',headers:{'Authorization':'Bearer '+tok()},body:fd});
  var j=await res.json().catch(function(){return{};});
  if(!res.ok||j.code!==200)throw new Error(j.message||j.detail||'上传失败');
  return (j.data&&j.data.url)||j.data;
}
function showLogin(){document.getElementById('loginView').style.display='flex';document.getElementById('mainView').style.display='none';}
function showMain(){document.getElementById('loginView').style.display='none';document.getElementById('mainView').style.display='block';}

var NAV=[
 {group:'工作台',items:[['dashboard','📊','数据看板']]},
 {group:'用户管理',items:[['users','👥','用户列表'],['admins','🛡','管理员管理']]},
 {group:'内容管理',items:[['articles','📄','攻略文章'],['posts','💬','社区帖子'],['comments','🗨','评论管理'],['review','✅','内容审核']]},
 {group:'省钱业务管理',items:[['coupons','🎟','优惠活动'],['prices','💰','商品报价记录'],['bills','📊','账单统计']]},
 {group:'AI 功能管理',items:[['ai-creations','✍','AI 创作记录'],['ai-reports','🧾','AI 账单报告'],['ai-plans','🗂','AI 执行计划'],['ai-reviews','🔍','AI 审核记录']]},
 {group:'系统管理',items:[['logs','📜','操作日志']]}
];
var TITLES={};NAV.forEach(function(g){g.items.forEach(function(i){TITLES[i[0]]=i[2];});});
function buildNav(){
  var h='';NAV.forEach(function(g){
    h+='<div class="group-title">'+esc(g.group)+'</div>';
    g.items.forEach(function(i){h+='<div class="nav-item" data-page="'+i[0]+'"><span class="nav-ic">'+i[1]+'</span><span class="nav-text">'+esc(i[2])+'</span><span class="nav-badge" id="badge-'+i[0]+'" style="display:none"></span></div>';});
  });
  document.getElementById('nav').innerHTML=h;
}
function go(page){location.hash='#/'+page;}
function currentPage(){var h=location.hash.replace('#/','');return TITLES[h]?h:'dashboard';}
function render(){
  if(PAGE_TEARDOWN){try{PAGE_TEARDOWN();}catch(e){}PAGE_TEARDOWN=null;}
  var p=currentPage();
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.page===p);});
  document.getElementById('crumb').innerHTML='管理后台 / <b>'+esc(TITLES[p])+'</b>';
  PAGES[p]();
}
window.addEventListener('hashchange',render);
var PAGE_TEARDOWN=null;   // 页面级清理（解绑 resize 等），避免切页后残留监听

var LIST={};
function listView(cfg){
  var st=LIST[cfg.key]||(LIST[cfg.key]={q:'',f:{},skip:0,limit:15,sel:{}});
  st.cfg=cfg;
  var root=document.getElementById('content');
  var h='<div class="panel"><div class="toolbar">';
  if(cfg.search)h+='<input type="text" id="lv-q" placeholder="'+esc(cfg.search.placeholder||'搜索')+'" value="'+esc(st.q)+'">';
  (cfg.filters||[]).forEach(function(f){
    h+='<select data-f="'+f.key+'"><option value="">'+esc(f.label)+'：全部</option>';
    f.options.forEach(function(o){h+='<option value="'+esc(o[0])+'"'+(st.f[f.key]===o[0]?' selected':'')+'>'+esc(o[1])+'</option>';});
    h+='</select>';
  });
  if(cfg.add)h+='<button class="btn" data-act="__add">+ '+esc(cfg.add.label||'新增')+'</button>';
  if(cfg.batch)h+='<button class="btn err" data-act="__batch">批量删除</button>';
  h+='<button class="btn ghost" data-act="__refresh">刷新</button></div>';
  h+='<div class="list-wrap"><table><thead><tr>';
  if(cfg.batch)h+='<th style="width:34px"><input type="checkbox" id="lv-all"></th>';
  cfg.columns.forEach(function(c){h+='<th>'+esc(c.label)+'</th>';});
  if(cfg.rowActions)h+='<th>操作</th>';
  h+='</tr></thead><tbody id="lv-body"><tr><td colspan="20" class="empty">加载中…</td></tr></tbody></table></div>';
  h+='<div class="pager" id="lv-pager"></div></div>';
  root.innerHTML=h;
  var qEl=document.getElementById('lv-q');
  if(qEl)qEl.addEventListener('keydown',function(e){if(e.key==='Enter'){st.q=qEl.value;st.skip=0;load();}});
  root.querySelectorAll('select[data-f]').forEach(function(s){s.addEventListener('change',function(){st.f[s.dataset.f]=s.value;st.skip=0;load();});});
  var allEl=document.getElementById('lv-all');
  if(allEl)allEl.addEventListener('change',function(){root.querySelectorAll('#lv-body input[data-sel]').forEach(function(c){c.checked=allEl.checked;st.sel[c.dataset.sel]=allEl.checked;});});
  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var act=b.dataset.act,id=b.dataset.id;
    if(act==='__refresh'){load();return;}
    if(act==='__add'){openForm(cfg,null);return;}
    if(act==='__batch'){var ids=Object.keys(st.sel).filter(function(k){return st.sel[k];});if(!ids.length){toast('请先勾选');return;}confirmBox('确认删除选中的 '+ids.length+' 条？',async function(){await api(cfg.batch,'POST',{ids:ids.map(Number)});st.sel={};toast('已删除');load();});return;}
    var row=st.rows&&st.rows.find(function(r){return String(r.id)===String(id);});
    if(cfg.onAct)cfg.onAct(act,row,load);
  });
  root.addEventListener('change',function(e){var c=e.target.closest('input[data-sel]');if(c){st.sel[c.dataset.sel]=c.checked;}});
  async function load(){
    var qs=[];if(cfg.search&&st.q)qs.push(cfg.search.key+'='+encodeURIComponent(st.q));
    Object.keys(st.f).forEach(function(k){if(st.f[k])qs.push(k+'='+encodeURIComponent(st.f[k]));});
    qs.push('skip='+st.skip,'limit='+st.limit);
    try{
      var d=await api(cfg.endpoint+'?'+qs.join('&'));
      st.rows=d.items||[];st.total=d.total||0;
      var tb=document.getElementById('lv-body');
      if(!st.rows.length){tb.innerHTML='<tr><td colspan="20" class="empty">暂无数据</td></tr>';}
      else{
        tb.innerHTML=st.rows.map(function(r){
          var tr='<tr>';
          if(cfg.batch)tr+='<td><input type="checkbox" data-sel="'+r.id+'"'+(st.sel[r.id]?' checked':'')+'></td>';
          cfg.columns.forEach(function(c){tr+='<td>'+(c.render?c.render(r):esc(r[c.key]))+'</td>';});
          if(cfg.rowActions){tr+='<td><div class="ops">'+cfg.rowActions(r).map(function(a){return '<button class="btn sm '+(a.cls||'ghost')+'" data-act="'+a.act+'" data-id="'+r.id+'">'+esc(a.label)+'</button>';}).join('')+'</div></td>';}
          return tr+'</tr>';
        }).join('');
      }
      var pages=Math.max(1,Math.ceil(st.total/st.limit));var cur=Math.floor(st.skip/st.limit)+1;
      document.getElementById('lv-pager').innerHTML='共 '+st.total+' 条 · 第 '+cur+'/'+pages+' 页 <button data-pg="prev" '+(cur<=1?'disabled':'')+'>上一页</button><button data-pg="next" '+(cur>=pages?'disabled':'')+'>下一页</button>';
      document.getElementById('lv-pager').querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){st.skip+=(b.dataset.pg==='next'?st.limit:-st.limit);st.skip=Math.max(0,st.skip);load();});});
    }catch(err){document.getElementById('lv-body').innerHTML='<tr><td colspan="20" class="empty">'+esc(err.message)+'</td></tr>';}
  }
  st.load=load;load();
}
function openForm(cfg,row){
  var spec=cfg.form(row);
  var h='<div class="mask" id="fm-mask"><div class="modal"><h3>'+esc(spec.title)+'</h3>';
  spec.fields.forEach(function(f){
    h+='<div class="f"><label>'+esc(f.label)+'</label>';
    var v=f.value==null?'':f.value;
    if(f.type==='textarea')h+='<textarea data-k="'+f.key+'">'+esc(v)+'</textarea>';
    else if(f.type==='select'){h+='<select data-k="'+f.key+'">'+f.options.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(v)===String(o[0])?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';}
    else if(f.type==='image'){h+='<div class="imgrow"><input type="text" data-k="'+f.key+'" value="'+esc(v)+'" placeholder="URL 或点上传"><button type="button" class="btn ghost" data-up="'+f.key+'">上传</button></div>';
      h+='<input type="file" accept="image/*" style="display:none" data-file="'+f.key+'">';}
    else h+='<input type="'+(f.type||'text')+'" data-k="'+f.key+'" value="'+esc(v)+'" placeholder="'+esc(f.placeholder||'')+'">';
    h+='</div>';
  });
  h+='<div class="foot"><button class="btn ghost" id="fm-cancel">取消</button><button class="btn" id="fm-ok">保存</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',h);
  document.querySelectorAll('#fm-mask [data-up]').forEach(function(b){
    b.onclick=function(){document.querySelector('#fm-mask [data-file="'+b.dataset.up+'"]').click();};
  });
  document.querySelectorAll('#fm-mask [data-file]').forEach(function(inp){
    inp.onchange=async function(){if(!inp.files[0])return;try{var url=await uploadImage(inp.files[0]);document.querySelector('#fm-mask [data-k="'+inp.dataset.file+'"]').value=url;toast('已上传');}catch(e){toast(e.message);}};
  });
  document.getElementById('fm-cancel').onclick=function(){document.getElementById('fm-mask').remove();};
  document.getElementById('fm-ok').onclick=async function(){
    var vals={};document.querySelectorAll('#fm-mask [data-k]').forEach(function(el){vals[el.dataset.k]=el.value;});
    try{await spec.onSubmit(vals,row);document.getElementById('fm-mask').remove();toast('已保存');if(LIST[cfg.key])LIST[cfg.key].load();}
    catch(err){toast(err.message);}
  };
}
function confirmBox(msg,onOk){

function detailModal(title,kv){

PAGES.dashboard=async function(){
  var root=document.getElementById('content');
  var inst={};   // 图表实例存在页面作用域，切页时统一 dispose
  root.innerHTML='<div class="grp-title">核心业务统计<span>来自 users / articles / posts / comments / bills / 审核队列</span></div><div class="cards core" id="dashCards"></div><div class="grp-title">AI 功能统计<span>来自 ai_creations / ai_bill_reports / ai_exec_plans / ai_reviews</span></div><div class="cards ai" id="dashCardsAI"></div><div class="grid2"><div class="panel"><h3>用户与内容趋势<span class="panel-note" id="trendNote"></span><select id="trendDays" style="margin-left:8px;padding:4px"><option value="7">近 7 天</option><option value="30">近 30 天</option></select></h3><div class="chart-wrap"><div id="chTrend" class="chart"></div><div id="chTrendEmpty" class="chart-empty" style="display:none"></div></div></div><div class="panel"><h3>账单分类支出<span class="panel-note">按金额占比，小额分类已并入其他</span></h3><div id="chPie" class="chart" style="height:300px"></div></div></div><div class="grid2"><div class="panel"><h3>近 6 个月账单记录数<span class="panel-note" id="monthNote"></span></h3><div id="chMonths" class="chart"></div></div><div class="panel" id="pendingPanel"><h3>待处理事项</h3><div id="dashPending"></div></div></div><div class="grid2"><div class="panel"><h3>最新动态<span class="panel-note">注册 / 攻略 / 帖子，不含私人账单内容</span></h3><div id="dashLatest"></div></div><div class="panel"><h3>最近 AI 运行<span class="panel-note">仅记录类型与受限用户标识</span></h3><div id="dashAI"></div></div></div>';
  async function load(){
    var days=document.getElementById('trendDays').value;
    var d;
    try{
      d=await api('/dashboard?days='+days);
    }catch(e){
      // 接口失败必须说「取不到」，不能画一张全零的图冒充正常数据
      document.getElementById('dashCards').innerHTML='<div class="stat-card"><div class="num" style="color:var(--err);font-size:16px">统计接口异常</div><div class="lbl">'+esc(e.message)+'</div></div>';
      document.getElementById('dashCardsAI').innerHTML='';
      ['chTrend','chPie','chMonths'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML='<p class="empty">数据获取失败</p>';});
      document.getElementById('dashPending').innerHTML='<div class="empty compact">数据获取失败</div>';
      return;
    }
    var c=d.counts;
    function card(x){return '<div class="stat-card '+(x[3]||'')+'" data-go="'+x[2]+'"><div class="num">'+(c[x[0]]||0)+'</div><div class="lbl">'+esc(x[1])+'</div></div>';}
    var core=[['users','用户总数','users'],['articles','攻略文章','articles'],['posts','社区帖子','posts'],['comments','评论总数','comments'],['bills','账单记录','bills'],['pending_total','待审核内容','review','warn']];
    var ai=[['ai_creations','AI 创作','ai-creations'],['ai_reports','AI 账单分析','ai-reports'],['ai_plans','AI 执行计划','ai-plans'],['ai_reviews','AI 审核','ai-reviews']];
    document.getElementById('dashCards').innerHTML=core.map(card).join('');
    document.getElementById('dashCardsAI').innerHTML=ai.map(function(x){return card([x[0],x[1],x[2],'ai']);}).join('');
    document.querySelectorAll('#dashCards [data-go], #dashCardsAI [data-go]').forEach(function(el){el.onclick=function(){go(el.dataset.go);};});
    var bd=document.getElementById('badge-review');bd.style.display=c.pending_total?'inline-block':'none';bd.textContent=c.pending_total;

    function money(v){v=parseFloat(v)||0;return v>=10000?(v/10000).toFixed(2)+' 万':v.toFixed(2);}
    function chart(id,opt){var el=document.getElementById(id);if(!el)return;if(inst[id])inst[id].dispose();inst[id]=echarts.init(el);inst[id].setOption(opt);}

    var tEl=document.getElementById('chTrend'), tEmpty=document.getElementById('chTrendEmpty');
    document.getElementById('trendNote').textContent='统计区间 '+d.trend.days[0]+' ~ '+d.trend.days[d.trend.days.length-1];
    if(d.trend.all_zero){
      if(inst.chTrend){inst.chTrend.dispose();delete inst.chTrend;}
      tEmpty.style.display='flex';
      tEmpty.innerHTML='<b>近 '+d.trend.range+' 天没有新增</b><span>用户 0 · 攻略 0 · 帖子 0（真实统计，非接口异常）</span>';
    }else{
      tEmpty.style.display='none';
      if(window.echarts)chart('chTrend',{tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},legend:{data:['新增用户','攻略发布','帖子发布'],top:0},grid:{left:44,right:20,top:34,bottom:26},xAxis:{type:'category',boundaryGap:true,data:d.trend.days,axisLine:{lineStyle:{color:'#D8DEE7'}}},yAxis:{type:'value',minInterval:1,axisLabel:{formatter:'{value}'}},series:[{name:'新增用户',type:'line',smooth:true,data:d.trend.users,itemStyle:{color:'#526CE5'}},{name:'攻略发布',type:'line',smooth:true,data:d.trend.articles,itemStyle:{color:'#18A775'}},{name:'帖子发布',type:'line',smooth:true,data:d.trend.posts,itemStyle:{color:'#E6A23C'}}]});
    }

    if(window.echarts){
      var pmap={};d.bill_pie.forEach(function(x){pmap[x.name]=x;});
      chart('chPie',{tooltip:{trigger:'item',formatter:function(p){return p.name+'<br/>¥'+money(p.value)+'　'+p.percent+'%<br/>'+((pmap[p.name]||{}).count||0)+' 笔';}},
        legend:{bottom:0,left:'center',icon:'roundRect',itemWidth:10,itemHeight:10,textStyle:{fontSize:11,color:'#5D6B7E'},
          formatter:function(name){var it=pmap[name]||{};return name+'  ¥'+money(it.value||0)+'  '+(it.pct||0)+'%';}},
        graphic:[{type:'text',left:'center',top:'37%',style:{text:'总支出\n¥'+money(d.bill_total),textAlign:'center',lineHeight:20,fontWeight:'bold',fontSize:13,fill:'#243040'}}],
        series:[{type:'pie',center:['50%','44%'],radius:['48%','68%'],avoidLabelOverlap:true,itemStyle:{borderColor:'#fff',borderWidth:2},
          label:{show:true,position:'inside',formatter:function(p){var it=pmap[p.name]||{};return (it.pct||0)>=10?it.pct+'%':'';},fontSize:11,color:'#fff'},
          labelLine:{show:false},
          data:d.bill_pie.length?d.bill_pie:[{name:'暂无账单',value:0,pct:0,count:0}]}]});
      document.getElementById('monthNote').textContent=d.bill_months.note||'统计口径：账单条数，不含金额';
      chart('chMonths',{tooltip:{trigger:'axis',formatter:function(ps){var p=ps[0];return p.name+'<br/>'+p.value+' 条账单记录';}},grid:{left:48,right:20,top:22,bottom:30},xAxis:{type:'category',data:d.bill_months.months.map(function(m){return m.slice(0,4)+'年'+parseInt(m.slice(5),10)+'月';})},yAxis:{type:'value',minInterval:1},series:[{type:'bar',barMaxWidth:34,data:d.bill_months.counts,itemStyle:{color:'#20344D',borderRadius:[4,4,0,0]},label:{show:true,position:'top',fontSize:11,color:'#5D6B7E'}}]});
    }else if(!window.echarts){
      ['chTrend','chPie','chMonths'].forEach(function(id){var el=document.getElementById(id);if(el&&el.offsetParent!==null)el.innerHTML='<p class="empty">图表库未加载</p>';});
    }

    var pd=d.pending,ph='';
    if(!c.pending_total && !pd.ai_manual.length){
      var pe=document.getElementById('pendingPanel');if(pe)pe.classList.add('sparse');
      document.getElementById('dashPending').innerHTML='<div class="empty compact">全部处理完毕，暂无待办</div>';
    }else{
      ph='<div style="color:var(--muted);font-size:12px;margin-bottom:6px">待审核攻略 '+pd.articles.length+' · 帖子 '+pd.posts.length+' · 需人工复核 AI '+pd.ai_manual.length+'</div>';
      pd.articles.forEach(function(a){ph+='<div class="act-item"><span class="tag warn">攻略</span><span class="t">'+esc(a.title)+'</span><button class="btn sm" data-go="review">处理</button></div>';});
      pd.posts.forEach(function(a){ph+='<div class="act-item"><span class="tag warn">帖子</span><span class="t">'+esc(a.title)+'</span><button class="btn sm" data-go="review">处理</button></div>';});
      pd.ai_manual.forEach(function(a){ph+='<div class="act-item"><span class="tag ai">AI复核</span><span class="t">'+en(a.target_type)+' #'+a.target_id+'</span><button class="btn sm" data-go="ai-reviews">查看</button></div>';});
      document.getElementById('dashPending').innerHTML=ph;
    }
    document.getElementById('dashPending').querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.dataset.go);};});

    var L=d.latest;
    function block(title,items,render){return '<div style="margin-bottom:10px"><div class="grp-title">'+title+'<span>'+items.length+' 条</span></div>'+(items.length?items.map(render).join(''):'<div class="act-item"><span class="t" style="color:var(--muted)">暂无</span></div>')+'</div>';}
    document.getElementById('dashLatest').innerHTML=
      block('最新注册',L.users,function(u){return '<div class="act-item"><span class="tag ok">用户</span><span class="t">'+esc(u.nickname)+'</span><span class="act-time">'+esc(u.created_at)+'</span></div>';})+
      block('最新攻略',L.articles,function(u){return '<div class="act-item"><span class="tag ai">攻略</span><span class="t">'+esc(u.title)+'</span>'+statusTag(u.status)+'<span class="act-time">'+esc(u.created_at.slice(5,16))+'</span></div>';})+
      block('最新帖子',L.posts,function(u){return '<div class="act-item"><span class="tag grey">帖子</span><span class="t">'+esc(u.title)+'</span>'+statusTag(u.status)+'<span class="act-time">'+esc(u.created_at.slice(5,16))+'</span></div>';});
    document.getElementById('dashAI').innerHTML=(L.ai||[]).map(function(a){return '<div class="act-item"><span class="tag ai">'+esc(a.kind)+'</span><span class="t">'+esc(a.ref)+'</span><span class="act-time">'+esc(a.created_at.slice(5,16))+'</span></div>';}).join('')||'<div class="empty compact">暂无 AI 运行记录</div>';
  }
  document.getElementById('trendDays').onchange=load;
  var onResize=function(){Object.keys(inst).forEach(function(k){if(inst[k])inst[k].resize();});};
  window.addEventListener('resize',onResize);
  PAGE_TEARDOWN=function(){window.removeEventListener('resize',onResize);Object.keys(inst).forEach(function(k){if(inst[k]){inst[k].dispose();delete inst[k];}});};
  await load();
};

    document.getElementById('rvP').innerHTML=rows(p.items,'posts');
    root.querySelectorAll('[data-s]').forEach(function(b){b.onclick=async function(){await api('/'+b.dataset.t+'/'+b.dataset.id+'/status','PATCH',{status:b.dataset.s});toast('已处理');load();};});
    root.querySelectorAll('[data-ai]').forEach(function(b){b.onclick=async function(){b.disabled=true;try{var d=await api('/ai-review?target_type='+(b.dataset.ai==='articles'?'article':'post')+'&target_id='+b.dataset.id);var res=(d&&d.result)||{};detailModal('AI 审核意见（仅供参考）',[['风险标签',esc((res.risk_tags||[]).join('、')||'无')],['需人工复核',(res.need_manual||res.needs_human)?'是':'否'],['垃圾内容',res.spam?'是':'否']]);}catch(e){toast(e.message);}b.disabled=false;};});
  }
  await load();
};

document.getElementById('loginBtn').onclick=async function(){
  var u=document.getElementById('loginUser').value,p=document.getElementById('loginPwd').value;
  try{var d=await api('/login','POST',{username:u,password:p});
    localStorage.setItem('admin_token',d.token);localStorage.setItem('admin_name',d.username);
    enter();}catch(e){document.getElementById('loginErr').textContent=e.message;}
};
document.getElementById('loginPwd').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('loginBtn').click();});
document.getElementById('logoutBtn').onclick=function(){localStorage.removeItem('admin_token');showLogin();};
document.getElementById('collapseBtn').onclick=function(){document.getElementById('sidebar').classList.toggle('collapsed');};
document.getElementById('nav').addEventListener('click',function(e){var n=e.target.closest('.nav-item');if(n)go(n.dataset.page);});
function enter(){
  showMain();buildNav();
  var name=localStorage.getItem('admin_name')||'admin';
  document.getElementById('adminName').textContent=name;
  document.getElementById('adminAvatar').textContent=name.charAt(0).toUpperCase();
  if(!location.hash)location.hash='#/dashboard';
  render();
}
if(tok()){enter();}else{showLogin();}
